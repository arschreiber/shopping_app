[project]
name = "mealplan"
version = "0.1.0"
description = "Wochenplan- & Einkaufs-App: Planung, Einkaufsliste, Bring!-Sync"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "rapidfuzz>=3.11",
    "httpx>=0.28",
    "apscheduler>=3.11",
    "typer>=0.15",
    "bring-api>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.123",
    "respx>=0.22",
    "ruff>=0.9",
]

[project.scripts]
mealplan = "mealplan.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mealplan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: trifft echte externe Dienste (Bring!, Korbunio) - nur manuell",
]
filterwarnings = ["error::DeprecationWarning:mealplan.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003: Umlaute und Gedankenstriche in deutschen Texten sind Absicht.
# B008: typer.Option gehört per Design in die Argument-Defaults.
# RUF012: SQLAlchemys `type_annotation_map` ist genau so vorgesehen.
ignore = ["RUF001", "RUF002", "RUF003", "B008", "RUF012"]
